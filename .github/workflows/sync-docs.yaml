name: Sync Docs to GH Pages

# Publishes this branch's docs under 0.8/docs, next to main's docs/ on gh-pages.
on:
  push:
    branches:
      - release-0.8

# A later push's deploy carries every earlier change, so a queued one can be dropped.
concurrency:
  group: sync-docs-${{ github.ref }}

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          target-folder: 0.8/docs
          # Rebase onto gh-pages instead of force-pushing: main's docs deploy and
          # chart-releaser also push there, and a force-push from a deploy that
          # started before theirs would drop their commits.
          force: false